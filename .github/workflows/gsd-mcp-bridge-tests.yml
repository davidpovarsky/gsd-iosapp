name: GSD Remote MCP - External HTTPS & OAuth Acceptance

on:
  workflow_dispatch:
  push:
    branches: [feat/hanlin-agent-api-20261122]
    paths:
      - '.github/workflows/gsd-mcp-bridge-tests.yml'
      - 'bridge/**'

permissions:
  contents: read

concurrency:
  group: gsd-mcp-live-public
  cancel-in-progress: false

jobs:
  gsd-mcp-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Local OAuth PKCE, MCP tool catalog and command roundtrip tests
        run: |
          node --check bridge/server.mjs
          node --check bridge/live_acceptance.mjs
          node --test bridge/server.test.mjs
      - name: Public canonical discovery, browser consent, PKCE and synthetic MCP roundtrip
        shell: bash
        env:
          GSD_BRIDGE_PUBLIC_BASE: https://torah-social.tail0a6c7d.ts.net:10000/gsd
          GSD_ACCEPTANCE_RECEIPT: gsd-acceptance/receipt.json
        run: |
          set -euo pipefail
          mkdir -p gsd-acceptance
          node bridge/live_acceptance.mjs 2>&1 | tee gsd-acceptance/live.log
      - name: Preserve public acceptance receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GSD-MCP-Public-Acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: gsd-acceptance/
          if-no-files-found: warn
          retention-days: 14
