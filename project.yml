name: GSD
options:
  bundleIdPrefix: com.itorah
  deploymentTarget:
    iOS: "27.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  useBaseInternationalization: true
settings:
  base:
    # Language mode, not compiler version: Xcode accepts only 4, 4.2, 5, and 6 here. The
    # Swift 6.4 compiler comes from Xcode 27 itself (iOS 27 refresh, 2026-09-15).
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "NA6HPWARQ2"   # owner's Apple Developer team — applies to all targets (incl. Phase 6 extensions)
    # Version is project-wide: the app and ALL embedded extensions must share one
    # CFBundleShortVersionString/CFBundleVersion (App Store rule). Bump these two lines
    # per release — never per-target (that's how the app/extension versions drifted apart).
    MARKETING_VERSION: "4.1.0"
    CURRENT_PROJECT_VERSION: "50"
    # Xcode 26 "recommended settings" — declared here so they survive `xcodegen
    # generate` (clicking "Perform Changes" in Xcode would edit the generated pbxproj
    # and be wiped). Keep these choices explicit for consistent generated projects.
    # No run-script build phases exist for sandboxing to gate.
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Existing literal keys include intentional case/punctuation variants.
    # Localization catalogs stay enabled; their unused Swift accessors do not.
    STRING_CATALOG_GENERATE_SYMBOLS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_FRAMEWORK_EXTENSIONS: "NO"
packages:
  TaskVisualizationKit:
    url: https://github.com/davidpovarsky/task-visualization-kit.git
    revision: a78c84e1df369ea7c93cf4b23d4f5d8d60e25293
  HanlinSDK:
    path: Vendor/HanlinSDK
  GSDKit:
    path: GSDKit
  GSDHanlinAgent:
    path: Packages/GSDHanlinAgent
targets:
  GSD:
    type: application
    platform: iOS
    sources:
      - App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The marketing-demo faux Home Screen renders the real widget view in-app; compiling
      # these two GSDWidgets sources into the app too keeps a single source of truth.
      - Widgets/TodaysFocusView.swift
      - Widgets/TodaysFocusEntry.swift
    info:
      path: App/Info.plist
      properties:
        # Home-screen label — anything longer than ~12 chars truncates under the icon.
        # The full "GSD Task Manager" name belongs in App Store Connect, not here.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, he]
        CFBundleDisplayName: GSD
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Required by the Mac App Store (Catalyst) archive validation; ignored by iOS, which
        # takes its category from App Store Connect. GSD is a task manager → productivity.
        LSApplicationCategoryType: public.app-category.productivity
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        # `fetch` only: the sole background task is a BGAppRefreshTask (com.itorah.gsd.refresh).
        # Declaring `processing` with no BGProcessingTask is an App Review question-magnet.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.itorah.gsd.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.itorah.gsd
            CFBundleURLSchemes:
              - gsd
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.itorah.gsd.new-task
            UIApplicationShortcutItemTitle: New Task
            UIApplicationShortcutItemSubtitle: Capture in GSD
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.itorah.gsd.today-focus
            UIApplicationShortcutItemTitle: Today's Focus
            UIApplicationShortcutItemSubtitle: Open priority tasks
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeFavorite
    dependencies:
      - package: TaskVisualizationKit
        product: TaskVisualizationKit
      - package: HanlinSDK
        product: HanlinChatCore
      - package: HanlinSDK
        product: HanlinAgentCore
      - package: HanlinSDK
        product: HanlinHostContracts
      - package: GSDHanlinAgent
        product: GSDHanlinAgent
      - package: GSDKit
        product: GSDModel
      - package: GSDKit
        product: GSDStore
      - package: GSDKit
        product: GSDWire
      - package: GSDKit
        product: GSDSync
      - package: GSDKit
        product: GSDSnapshot
      - target: GSDWidgets
        embed: true
        platformFilter: iOS
      # The watch app rides in the iPhone app's Watch/ folder. iOS only, so the Catalyst build
      # carries no watch content (spec 7).
      - target: GSDWatch
        embed: true
        platformFilter: iOS
      # No platformFilter — the Share Extension is built for Mac Catalyst too, so GSD
      # appears in the macOS Share menu (Widgets stay iOS-only above).
      - target: GSDShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd
        # Runtime availability cannot guard a symbol missing from the build SDK.
        # Keep the iOS 27.1 vertical-toolbar reader when using a newer SDK.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*26.*]": "$(inherited) GSD_SDK_WITHOUT_VERTICAL_TOOLBARS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.0*]": "$(inherited) GSD_SDK_WITHOUT_VERTICAL_TOOLBARS"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/GSD.entitlements
        CODE_SIGN_STYLE: Automatic
        # --- Mac Catalyst ---
        SUPPORTS_MACCATALYST: "YES"
        # Keep com.itorah.gsd on both platforms (one App Store Connect record).
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        # macOS-SDK (Catalyst) build uses sandbox entitlements; iOS keeps GSD.entitlements.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/GSD-Catalyst.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GSD_Tasks_MAIN_AppStore_20261123

  GSDWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, he]
        CFBundleDisplayName: GSD Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd.widgets
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Widgets/GSDWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GSD_Tasks_WIDGETS_AppStore_20261123
    dependencies:
      - package: GSDKit
        product: GSDModel
      - package: GSDKit
        product: GSDSnapshot
  GSDWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - WatchShared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, he]
        CFBundleDisplayName: GSD
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.itorah.gsd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Watch/GSDWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    # Only the model and the GRDB-free contract. GSDStore, GSDSync and GSDWire stay off the watch.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GSD_Tasks_WATCH_AppStore_20261123
    dependencies:
      - package: GSDKit
        product: GSDModel
      - package: GSDKit
        product: GSDSnapshot
      - target: GSDWatchWidgets
        embed: true
  GSDWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - WatchShared
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, he]
        CFBundleDisplayName: GSD Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd.watchkitapp.widgets
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/GSDWatchWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GSD_Tasks_WATCHWIDGETS_AppStore_20261123
    dependencies:
      - package: GSDKit
        product: GSDModel
      - package: GSDKit
        product: GSDSnapshot
  GSDShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, he]
        CFBundleDisplayName: GSD
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd.share
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/GSDShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        # --- Mac Catalyst --- so GSD is a share target on macOS too.
        SUPPORTS_MACCATALYST: "YES"
        # Keep com.itorah.gsd.share on both platforms (one App Store Connect record).
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        # macOS-SDK (Catalyst) build needs sandbox entitlements; iOS keeps its own file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ShareExtension/GSDShareExtension-Catalyst.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GSD_Tasks_SHARE_AppStore_20261123
    dependencies:
      - package: GSDKit
        product: GSDModel
      - package: GSDKit
        product: GSDSnapshot
      - package: GSDKit
        product: GSDWire   # direct push from the compose sheet; GRDB-free
  # App Store screenshots and native release acceptance (the correctness test target — the app's logic gate
  # remains `swift test` + a clean build). Drives the live app through its main screens
  # and writes full-res PNGs; see ScreenshotTests/ScreenshotTests.swift for the env vars.
  GSDScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ScreenshotTests
    dependencies:
      - target: GSD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.gsd.screenshot-tests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: GSD
        GENERATE_INFOPLIST_FILE: "YES"
# A single shared scheme that builds/archives the GSD app (extensions ride along as
# embedded dependencies). Without this, Xcode auto-creates one scheme per target and may
# default to GSDShareExtension, mislabeling the archive — the bug this resolves.
schemes:
  GSD:
    build:
      targets:
        GSD: all
    run:
      config: Debug
    archive:
      config: Release
  # Watch simulator builds. GSD embeds GSDWatch, so the GSD scheme builds it for iPhone archives.
  GSDWatch:
    build:
      targets:
        GSDWatch: all
    run:
      config: Debug
  # Separate scheme so screenshot runs never touch the main GSD scheme/archive flow.
  GSDScreenshots:
    build:
      targets:
        GSDScreenshotTests: all
    test:
      config: Debug
      targets:
        - GSDScreenshotTests
